<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo con Luces</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            position: relative;
            text-align: center;
            z-index: 10;
        }
        h1 {
            font-size: 5rem;
            text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #e60073, 0 0 40px #e60073, 0 0 50px #e60073, 0 0 60px #e60073, 0 0 70px #e60073;
            animation: pulsate 1.5s infinite alternate;
        }
        @keyframes pulsate {
            100% {
                text-shadow: 0 0 4px #fff, 0 0 11px #fff, 0 0 19px #fff, 0 0 40px #0fa, 0 0 80px #0fa, 0 0 90px #0fa, 0 0 100px #0fa, 0 0 150px #0fa;
            }
            0% {
                text-shadow: 0 0 2px #fff, 0 0 4px #fff, 0 0 6px #fff, 0 0 10px #0fa, 0 0 45px #0fa, 0 0 55px #0fa, 0 0 70px #0fa, 0 0 80px #0fa;
            }
        }

        /* Luces de fondo */
        .light {
            position: absolute;
            border-radius: 50%;
            background: white;
            opacity: 0.7;
            animation: moveLight 5s infinite ease-in-out alternate;
        }

        .light1 { top: 10%; left: 20%; width: 50px; height: 50px; box-shadow: 0 0 50px 20px #ff0055; background: #ff0055; animation-delay: 0s; }
        .light2 { top: 80%; left: 80%; width: 80px; height: 80px; box-shadow: 0 0 80px 30px #00ffcc; background: #00ffcc; animation-delay: 1s; }
        .light3 { top: 50%; left: 10%; width: 40px; height: 40px; box-shadow: 0 0 40px 15px #ffcc00; background: #ffcc00; animation-delay: 2s; }
        .light4 { top: 20%; left: 70%; width: 60px; height: 60px; box-shadow: 0 0 60px 25px #aa00ff; background: #aa00ff; animation-delay: 3s; }
        .light5 { top: 70%; left: 30%; width: 70px; height: 70px; box-shadow: 0 0 70px 30px #0055ff; background: #0055ff; animation-delay: 0.5s; }
        .light6 { top: 40%; left: 50%; width: 90px; height: 90px; box-shadow: 0 0 90px 40px #ff00aa; background: #ff00aa; animation-delay: 1.5s; }

        @keyframes moveLight {
            0% { transform: scale(1) translate(0, 0); opacity: 0.5; }
            50% { transform: scale(1.5) translate(30px, -30px); opacity: 0.8; }
            100% { transform: scale(1) translate(-30px, 30px); opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="light light1"></div>
    <div class="light light2"></div>
    <div class="light light3"></div>
    <div class="light light4"></div>
    <div class="light light5"></div>
    <div class="light light6"></div>

    <div class="container">
        <h1>Hola Mundo</h1>
    </div>
</body>
</html>
